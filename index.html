<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Mando - Módulos MAC</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Evita barras de desplazamiento */
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Video de Fondo a Pantalla Completa en Bucle apuntando a mayitovideo.mp4 */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            object-fit: cover;
            filter: brightness(0.85) contrast(1.1); /* Ajuste de brillo para que los elementos resalten */
        }

        /* Elemento dinámico opcional en la esquina */
        .floating-frame {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #4ea8de;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(78, 168, 222, 0.6);
            animation: pulse-glow 2.5s infinite alternate;
            z-index: 10;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(78, 168, 222, 0.4); }
            100% { transform: scale(1.08); box-shadow: 0 0 20px rgba(230, 57, 70, 0.8); }
        }

        .hero-section {
            padding: 25px 20px 10px 20px;
            text-align: center;
            position: relative;
            z-index: 5;
        }

        .welcome-badge {
            background-color: #e63946;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 5px;
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.5);
        }

        /* Contenedor Central */
        .main-menu-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 10px 20px;
            z-index: 5;
        }

        /* Barra Flotante de Accesos en Línea con Animación de Flotación (Arriba y Abajo) */
        .inline-menu-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 900px;
            animation: flotar-carrusel 4s ease-in-out infinite;
        }

        @keyframes flotar-carrusel {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); } /* Sube y baja suavemente sin perder su lugar */
        }

        .inline-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.3s ease;
        }

        .inline-item:hover {
            transform: scale(1.1) translateY(-5px);
        }

        .inline-icon {
            width: 70px;
            height: 70px;
            background: rgba(13, 27, 42, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        /* Colores de Brillo Únicos por Botón */
        .btn-dir .inline-icon { color: #4ea8de; border-color: #4ea8de; }
        .btn-dir:hover .inline-icon { background: #4ea8de; color: #0d1b2a; box-shadow: 0 0 30px #4ea8de; }

        .btn-rep .inline-icon { color: #2ec4b6; border-color: #2ec4b6; }
        .btn-rep:hover .inline-icon { background: #2ec4b6; color: #0d1b2a; box-shadow: 0 0 30px #2ec4b6; }

        .btn-trans .inline-icon { color: #ff9f1c; border-color: #ff9f1c; }
        .btn-trans:hover .inline-icon { background: #ff9f1c; color: #0d1b2a; box-shadow: 0 0 30px #ff9f1c; }

        .btn-fol .inline-icon { color: #e63946; border-color: #e63946; }
        .btn-fol:hover .inline-icon { background: #e63946; color: #fff; box-shadow: 0 0 30px #e63946; }

        .inline-label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 8px;
            background: rgba(13, 27, 42, 0.85);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Pie de página con marca Carrivers Design */
        footer {
            text-align: center;
            padding: 12px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 5;
        }

        .carrivers-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .text-blue-carrivers { color: #4ea8de; }
        .text-red-carrivers { color: #e63946; }

        /* Ajuste responsivo para celulares */
        @media (max-width: 576px) {
            .inline-menu-bar {
                gap: 15px;
            }
            .inline-icon {
                width: 55px;
                height: 55px;
                font-size: 1.3rem;
            }
            .floating-frame {
                width: 45px;
                height: 45px;
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Video de Fondo en Bucle con mayitovideo.mp4 -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="mayitovideo.mp4" type="video/mp4">
        Tu navegador no soporta videos en HTML5.
    </video>

    <!-- Imagen opcional en movimiento en la esquina -->
    <img src="videoframe_12538.png" alt="Elemento dinámico MAC" class="floating-frame">

    <!-- Cabecera -->
    <div class="hero-section">
        <div>
            <span class="welcome-badge"><i class="fas fa-bolt"></i> Sistema Activo - Módulos MAC</span>
        </div>
        <h1 class="fw-bold mb-1 text-white fs-3">Centro de Mando</h1>
        <p class="text-light opacity-75 small m-0">Selecciona el módulo al que deseas ingresar:</p>
    </div>

    <!-- Menú Central con Accesos en Línea Flotantes -->
    <div class="container main-menu-wrapper">
        <div class="inline-menu-bar">
            
            <!-- Directorio MAC -->
            <a href="https://registro03coah.github.io/directorioMAC/" class="inline-item btn-dir">
                <div class="inline-icon"><i class="fas fa-address-book"></i></div>
                <span class="inline-label">Directorio MAC</span>
            </a>

            <!-- Sistema de Reportes -->
            <a href="https://registro03coah.github.io/sistema-reportes-mac/" class="inline-item btn-rep">
                <div class="inline-icon"><i class="fas fa-chart-line"></i></div>
                <span class="inline-label">Reportes Diarios</span>
            </a>

            <!-- Transmisiones MAC -->
            <a href="https://registro03coah.github.io/TransmisionesMAC/" class="inline-item btn-trans">
                <div class="inline-icon"><i class="fas fa-broadcast-tower"></i></div>
                <span class="inline-label">Transmisiones</span>
            </a>

            <!-- Folios y Oficios -->
            <a href="https://registro03coah.github.io/Foliosoficios/" class="inline-item btn-fol">
                <div class="inline-icon"><i class="fas fa-folder-open"></i></div>
                <span class="inline-label">Folios y Oficios</span>
            </a>

        </div>
    </div>

    <!-- Pie de página con diseño Carrivers Design -->
    <footer>
        <p class="mb-0">Módulos MAC © 2026 | Diseñado por <span class="carrivers-brand"><span class="text-blue-carrivers">Carrivers</span> <span class="text-red-carrivers">Design</span></span></p>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
