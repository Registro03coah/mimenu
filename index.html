<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Mando - Módulos MAC</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Evita barras de desplazamiento en la página principal */
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(10, 20, 35, 0.75), rgba(15, 32, 67, 0.85)), url('menuavatar.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Elemento en movimiento flotante en la esquina */
        .floating-frame {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #4ea8de;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(78, 168, 222, 0.6);
            animation: pulse-glow 2.5s infinite alternate;
            z-index: 10;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(78, 168, 222, 0.4); }
            100% { transform: scale(1.08); box-shadow: 0 0 20px rgba(230, 57, 70, 0.8); }
        }

        .hero-section {
            padding: 20px 20px 5px 20px;
            text-align: center;
            position: relative;
            z-index: 5;
        }

        .welcome-badge {
            background-color: #e63946;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 5px;
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.4);
        }

        /* Contenedor Central Compacto */
        .main-menu-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 10px 20px;
        }

        /* Tu Avatar Central */
        .core-avatar-container {
            margin-bottom: 25px;
            z-index: 5;
        }

        .core-avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #e63946;
            object-fit: cover;
            box-shadow: 0 0 35px rgba(230, 57, 70, 0.7);
            animation: flotar-core 3s ease-in-out infinite;
        }

        @keyframes flotar-core {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Barra Flotante de Accesos en Línea */
        .inline-menu-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 900px;
            z-index: 5;
        }

        .inline-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.3s ease;
        }

        .inline-item:hover {
            transform: translateY(-8px);
        }

        .inline-icon {
            width: 65px;
            height: 65px;
            background: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        /* Colores de Brillo Únicos por Botón */
        .btn-dir .inline-icon { color: #4ea8de; border-color: #4ea8de; }
        .btn-dir:hover .inline-icon { background: #4ea8de; color: #0d1b2a; box-shadow: 0 0 25px #4ea8de; }

        .btn-rep .inline-icon { color: #2ec4b6; border-color: #2ec4b6; }
        .btn-rep:hover .inline-icon { background: #2ec4b6; color: #0d1b2a; box-shadow: 0 0 25px #2ec4b6; }

        .btn-trans .inline-icon { color: #ff9f1c; border-color: #ff9f1c; }
        .btn-trans:hover .inline-icon { background: #ff9f1c; color: #0d1b2a; box-shadow: 0 0 25px #ff9f1c; }

        .btn-fol .inline-icon { color: #e63946; border-color: #e63946; }
        .btn-fol:hover .inline-icon { background: #e63946; color: #fff; box-shadow: 0 0 25px #e63946; }

        .inline-label {
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 8px;
            background: rgba(13, 27, 42, 0.85);
            padding: 3px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
        }

        /* Pie de página con diseño Carrivers Design en Azul y Rojo */
        footer {
            text-align: center;
            padding: 12px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 5;
        }

        .carrivers-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .text-blue-carrivers { color: #4ea8de; }
        .text-red-carrivers { color: #e63946; }

        /* Ajuste responsivo para celulares */
        @media (max-width: 576px) {
            .core-avatar-img {
                width: 95px;
                height: 95px;
            }
            .inline-menu-bar {
                gap: 12px;
            }
            .inline-icon {
                width: 52px;
                height: 52px;
                font-size: 1.2rem;
            }
            .floating-frame {
                width: 45px;
                height: 45px;
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Imagen de movimiento flotante en la esquina -->
    <img src="videoframe_12538.png" alt="Elemento dinámico MAC" class="floating-frame">

    <!-- Cabecera -->
    <div class="hero-section">
        <div>
            <span class="welcome-badge"><i class="fas fa-bolt"></i> Sistema Activo - Módulos MAC</span>
        </div>
        <h1 class="fw-bold mb-1 text-white fs-3">Centro de Mando</h1>
        <p class="text-light opacity-75 small m-0">Selecciona el módulo al que deseas ingresar:</p>
    </div>

    <!-- Menú Central Compacto con Accesos en Línea y Flotantes -->
    <div class="container main-menu-wrapper">
        
        <!-- Tu Avatar Central -->
        <div class="core-avatar-container">
            <img src="mayito admin.jpeg" alt="Avatar Mayito Admin" class="core-avatar-img">
        </div>

        <!-- Barra de Enlaces en Línea -->
        <div class="inline-menu-bar">
            
            <!-- Directorio MAC -->
            <a href="https://registro03coah.github.io/directorioMAC/" class="inline-item btn-dir">
                <div class="inline-icon"><i class="fas fa-address-book"></i></div>
                <span class="inline-label">Directorio MAC</span>
            </a>

            <!-- Sistema de Reportes -->
            <a href="https://registro03coah.github.io/sistema-reportes-mac/" class="inline-item btn-rep">
                <div class="inline-icon"><i class="fas fa-chart-line"></i></div>
                <span class="inline-label">Reportes Diarios</span>
            </a>

            <!-- Transmisiones MAC -->
            <a href="https://registro03coah.github.io/TransmisionesMAC/" class="inline-item btn-trans">
                <div class="inline-icon"><i class="fas fa-broadcast-tower"></i></div>
                <span class="inline-label">Transmisiones</span>
            </a>

            <!-- Folios y Oficios -->
            <a href="https://registro03coah.github.io/Foliosoficios/" class="inline-item btn-fol">
                <div class="inline-icon"><i class="fas fa-folder-open"></i></div>
                <span class="inline-label">Folios y Oficios</span>
            </a>

        </div>
    </div>

    <!-- Pie de página con marca Carrivers Design -->
    <footer>
        <p class="mb-0">Módulos MAC © 2026 | Diseñado por <span class="carrivers-brand"><span class="text-blue-carrivers">Carrivers</span> <span class="text-red-carrivers">Design</span></span></p>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
